<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile component</title>
  <link rel="stylesheet" href="../../templates/User-component/profile-component.css">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body id="component">
<main>
  <div class="profile-container">
    <div class="profile-card">
      <div class="profile-header">
        <div class="avatar">
          <i class="fas fa-user"></i>
        </div>
        <h1>Mi Perfil</h1>
        <p>Administra tu información personal</p>
      </div>

      <form class="profile-form">
        <div class="form-group">
          <label>Nombre de usuario</label>
          <input type="text" name="user-name" placeholder="Ej: Campo 1">
        </div>
        <div class="form-group">
          <label>Nombre</label>
          <input type="text" name="firstName" placeholder="Ej: Campo 2">
        </div>

        <div class="form-group">
          <label>Apellidos</label>
          <input type="text" name="lastName" placeholder="Ej: Campo 3">
        </div>

        <div class="form-group">
          <label>Correo electrónico</label>
          <input type="email" name="email" placeholder="Ej: campo 4">
        </div>

        <div class="form-group">
          <label>Teléfono</label>
          <input type="tel" name="phone" placeholder="Ej: campo 5">
        </div>

        <button type="submit" class="save-button">Botón 1</button>
        <button type="button" class="logout-button">Botón 2</button>
      </form>
    </div>
  </div>
</main>

<script type="module" src="../../templates/User-component/personal-profile.js"></script>
</body>
</html>
