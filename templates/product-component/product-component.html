<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../../templates/product-component/product-component.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <template id="product-template">
        <article id="product" class="product-info-link">
            <div id="product-image" class="product-info-link">
                <img id="image" alt="Producto">
            </div>
            <p id="product-name"></p>
            <p id="product-desc"></p>
            <p class="price"><span id="price" class="price"> </span> € </p>
            <div class="buttons">
                <button id="see">Ver</button>
                <button id="add-to-cart">Añadir al carrito</button>
            </div>
        </article>
    </template>
</body>
</html>
