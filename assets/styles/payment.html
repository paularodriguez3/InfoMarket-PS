<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pasarela de pago</title>
  <link rel="stylesheet" href="payment.css"> <!-- Vinculamos el archivo CSS -->
  <script type="module" src="../../scripts/payment/payment.js" defer></script> <!-- Añade type="module" -->
</head>
<body>

<h1>Pago</h1>
<p>Haz clic en la opción de pago que desee</p>

<!-- Campo para ingresar código de descuento -->
<label for="discount-code">Código de descuento:</label>
<input type="text" id="discount-code" placeholder="Introduce tu código">
<button id="apply-discount">Aplicar descuento</button>

<p>Total a pagar: <span id="total-amount">10.00</span>€</p>

<div id="paypal-button-container"></div>

</body>
</html>
