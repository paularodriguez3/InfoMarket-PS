<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../assets/icons/header/infomarket_logo_mini.png" type="image/png">
  <link rel="stylesheet" href="../assets/styles/sign-in.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <title>Inicio de sesión - Infomarket</title>
</head>
<body>

<header id="header"></header>
<nav id="nav-bar"></nav>

<main class="login-container">
  <div class="auth-wrapper">
    <div class="logo-container">
      <img src="../assets/icons/header/infomarket_logo_mini.png" alt="InfoMarket Logo" class="login-logo">
    </div>
    <h1 class="auth-title">Iniciar sesión</h1>
    <p class="auth-subtitle">Introduce tus credenciales para acceder a tu cuenta</p>

    <form class="auth-form">
      <div class="input-group">
        <input type="text" placeholder="Nombre de usuario" required>
        <i class="fas fa-user"></i>
      </div>

      <div class="input-group">
        <input type="password" placeholder="Contraseña" required>
        <i class="fas fa-lock"></i>
      </div>

      <div class="form-options">
        <label class="custom-checkbox">
          <input type="checkbox">
          <span class="checkmark"></span>
          Recordar usuario
        </label>
        <a href="#" class="text-link">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="primary-button">Continuar</button>

      <div class="form-divider">
        <span>o</span>
      </div>

      <button type="button" class="secondary-button">
        Crear nueva cuenta
      </button>
    </form>
  </div>
</main>

<footer id="footer"></footer>
<script src="../scripts/common.js"></script>

</body>
</html>
