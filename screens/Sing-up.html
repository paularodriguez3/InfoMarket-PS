<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../assets/icons/header/infomarket_logo_mini.png" type="image/png">
  <link rel="stylesheet" href="../assets/styles/sign-up.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <title>Registro - Infomarket</title>
</head>
<body>

<header id="header"></header>
<nav id="nav-bar"></nav>

<main class="auth-container">
  <div class="auth-wrapper">
    <div class="logo-container">
      <img src="../assets/icons/header/infomarket_logo_mini.png" alt="InfoMarket Logo" class="login-logo">
    </div>
    <h1 class="auth-title">Crear cuenta</h1>
    <p class="auth-subtitle">Regístrate en solo unos pasos</p>

    <form class="auth-form">
      <div class="input-group">
        <input type="text" placeholder="Nombre de usuario" required>
        <i class="fas fa-user"></i>
      </div>

      <div class="input-group">
        <input type="email" placeholder="Correo electrónico" required>
        <i class="fas fa-envelope"></i>
      </div>

      <div class="input-group">
        <input type="password" placeholder="Contraseña" required>
        <i class="fas fa-lock"></i>
      </div>

      <div class="form-options">
        <label class="custom-checkbox">
          <input type="checkbox" required>
          <span class="checkmark"></span>
          Acepto los <a href="#" class="text-link">Términos y condiciones</a>
        </label>
      </div>

      <button type="submit" class="primary-button">Registrarse</button>

      <div class="auth-footer">
        ¿Ya tienes una cuenta? <a href="sign-in.html" class="text-link">Inicia sesión</a>
      </div>
    </form>
  </div>
</main>

<footer id="footer"></footer>
<script src="../scripts/common.js"></script>

</body>
</html>
