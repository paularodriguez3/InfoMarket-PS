<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="../assets/icons/header/infomarket_logo_mini.png" type="image/png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Recuperar contraseña - Infomarket</title>
    <link rel="stylesheet" href="../assets/styles/forgotten-password.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600&display=swap">
</head>
<body>

<header id="header"></header>
<nav id="nav-bar"></nav>

<main class="container">
    <div class="content-wrapper">
        <section class="recuperacion">
            <div class="logo-container">
                <img src="../assets/icons/header/infomarket_logo_mini.png" alt="Infomarket Logo" class="logo">
            </div>
            <h1>Recuperación de contraseña</h1>
            <p class="subtitle">Introduce tu correo electrónico para establecer una recuperación de cuenta o cambio de contraseña</p>
            <form action="#" method="post">
                <div class="input-container">
                    <input type="email" placeholder="Correo electrónico" required>
                </div>
                <button type="submit">Continuar</button>
            </form>
            <div class="footer-links">
                <a href="#" class="link">Volver al inicio de sesión</a>
            </div>
        </section>
    </div>
</main>

<footer id="footer"></footer>
<script src="../scripts/common.js"></script>

</body>
</html>
