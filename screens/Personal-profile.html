<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="../assets/icons/header/infomarket_logo_mini.png" type="image/png">
  <link rel="stylesheet" href="../assets/styles/profile-component.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil de Usuario | Infomarket</title>
</head>
<body>

<header id="header"></header>
<nav id="nav-bar"></nav>

<main>
  <div class="profile-container">
    <div class="profile-card">
      <div class="profile-header">
        <div class="avatar">
          <i class="fas fa-user"></i>
        </div>
        <h1>Mi Perfil</h1>
        <p>Administra tu información personal</p>
      </div>

      <form class="profile-form">
        <div class="form-group">
          <label>Nombre</label>
          <input type="text" placeholder="Ej: Kevin">
        </div>

        <div class="form-group">
          <label>Apellidos</label>
          <input type="text" placeholder="Ej: Fuera del Grupo">
        </div>

        <div class="form-group">
          <label>Correo electrónico</label>
          <input type="email" placeholder="Ej: ejemplo@gmail.com">
        </div>

        <div class="form-group">
          <label>Teléfono</label>
          <input type="tel" placeholder="Ej: 600 000 000">
        </div>

        <button type="submit" class="save-button">Guardar cambios</button>
      </form>
    </div>
  </div>
</main>

<footer id="footer"></footer>
<script src="../scripts/common.js"></script>

</body>
</html>
