<main class="container">
  <div class="content-wrapper">
    <section class="recuperacion">
      <div class="logo-container">
        <img
          src="../assets/icons/header/infomarket_logo_mini.png"
          alt="Infomarket Logo"
          class="logo"
        />
      </div>

      <h1>Recuperación de contraseña</h1>
      <p class="subtitle">
        Introduce tu correo electrónico para establecer una recuperación de cuenta o cambio de contraseña
      </p>

      <form (ngSubmit)="onSubmit()" #form="ngForm">
        <div class="input-container">
          <input
            type="email"
            [(ngModel)]="email"
            name="email"
            placeholder="Correo electrónico"
            required
          />
        </div>
        <button type="submit" [disabled]="sending || cooldown > 0 || form.invalid">
          {{ cooldown > 0 ? 'Espera ' + cooldown + 's' : 'Continuar' }}
        </button>
      </form>

      <div *ngIf="message" class="message">
        {{ message }}
      </div>

      <div class="footer-links">
        <a routerLink="/sign-in" class="link">Volver al inicio de sesión</a>
      </div>
    </section>
  </div>
</main>
