<main class="container">
  <div class="content-wrapper">
    <section class="recuperacion">
      <div class="logo-container">
        <img
          src="../assets/icons/header/infomarket_logo_mini.png"
          alt="Infomarket Logo"
          class="logo"
        />
      </div>

      <h1>{{ 'RECOVERY.TITLE' | translate }}</h1>
      <p class="subtitle">
        {{ 'RECOVERY.SUBTITLE' | translate }}
      </p>

      <form (ngSubmit)="onSubmit()" #form="ngForm">
        <div class="input-container">
          <input
            type="email"
            [(ngModel)]="email"
            name="email"
            [placeholder]="'RECOVERY.EMAIL_PLACEHOLDER' | translate"
            required
          />
        </div>
        <button type="submit" [disabled]="sending || cooldown > 0 || form.invalid">
          {{ cooldown > 0 ? ('RECOVERY.WAIT' | translate) + ' ' + cooldown + 's' : ('RECOVERY.CONTINUE' | translate) }}
        </button>
      </form>

      <div *ngIf="message" class="message">
        {{ message }}
      </div>

      <div class="footer-links">
        <a routerLink="/sign-in" class="link">{{ 'RECOVERY.BACK_TO_LOGIN' | translate }}</a>
      </div>
    </section>
  </div>
</main>
