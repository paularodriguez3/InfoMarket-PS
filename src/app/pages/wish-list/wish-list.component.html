<main>
  <h1 id="shopping-cart-title">
    <i class='bx bx-star'></i> {{ 'WISHLIST.TITLE' | translate }}
  </h1>
  <article id="shopping-info">
    <div id="shopping-cart-list">
      <div *ngFor="let product of wishlistItems">
        <app-wish-product-info
          [product]="product"
          (removeProduct)="removeFromWishList($event)">
        </app-wish-product-info>
      </div>
    </div>
  </article>
</main>
