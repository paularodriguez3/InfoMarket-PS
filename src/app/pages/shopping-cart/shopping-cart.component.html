<main>
  <h1 id="shopping-cart-title"><i class='bx bx-cart'></i> Carrito de compra</h1>
  <article id="shopping-info">
    <div id="shopping-cart-list">
      <div *ngFor="let item of shoppingCart">
        <app-product-info
          [item]="item"
          [showButtons]="true"
          (increaseQty)="increase($event)"
          (decreaseQty)="decrease($event)"
          (removeItem)="removeItem($event)">
        </app-product-info>
      </div>
    </div>
    <section id="buy-panel">
      <div id="price-section">
        <ng-container *ngIf="hasAnyDiscount(); else noDiscount">
          <div id="total-original">
            {{ calculateOriginalTotal().toFixed(2) }}€
          </div>

          <div id="discount-applied">
            -{{ calculateTotalDiscount().toFixed(2) }}€
          </div>

          <hr class="divider" />

          <div id="total-final">
            {{ calculateTotalPrice().toFixed(2) }}€
          </div>
        </ng-container>

        <ng-template #noDiscount>
          <div id="total-price">
            {{ calculateTotalPrice().toFixed(2) }}€
          </div>
        </ng-template>
      </div>
      <button id="buy-button" (click)="buy()">Procesar pedido</button>
      <button id="clear-cart-button" *ngIf="!cartIsEmpty()" (click)="clearCart()">Vaciar carrito</button>
      <button id="continue-shopping-button" (click)="continueShopping()">Seguir comprando</button>
    </section>
  </article>
</main>
