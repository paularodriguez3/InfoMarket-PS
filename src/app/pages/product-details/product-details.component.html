<main>
  <article id="product-details">
    <section id="product-details-info">
      <h1 id="product-name"></h1>
      <p id="product-desc"> </p>
      <p id="features">Características del producto: </p>
      <hr class = "hr-features">
      <div id="product-features"></div>
      <hr class = "hr-features">
      <p id="product-stock">Stock: <span>¡Últimas unidades!</span></p>
      <div id="quantity-container">
        <div class="quantity-selector">
          <p id="product-quantity">Cantidad: </p>
          <button class="qty-button" id="minus"><i class='bx bxs-minus-circle' ></i></button>
          <p id="qty-value">1</p>
          <button class="qty-button" id="plus"><i class='bx bxs-plus-circle' ></i></button>
        </div>
      </div>
      <p id="final-price"> Precio total: <span id="price"></span> € </p>
      <hr class = "hr-features">
      <div id="add-to-cart">
        <button type=submit id="add-to-cart-button">Añadir al carrito</button>
      </div>
    </section>
    <div id="product-image">
      <img id="image" alt="Producto">
      <div id="button-arrows">
        <button id="prev-image"><i class='bx bx-chevron-left'></i></button>
        <button id="next-image"><i class='bx bx-chevron-right'></i></button>
      </div>
    </div>
  </article>
</main>
