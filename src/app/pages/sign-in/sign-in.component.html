<main class="login-container">
  <div class="auth-wrapper">
    <div class="logo-container">
      <img src="../assets/icons/header/infomarket_logo_mini.png" alt="InfoMarket Logo" class="login-logo">
    </div>
    <h1 class="auth-title">Iniciar sesión</h1>
    <p class="auth-subtitle">Introduce tus credenciales para acceder a tu cuenta</p>

    <form class="auth-form" (ngSubmit)="onSubmit($event)">
      <div class="input-group">
        <input [(ngModel)]="email" name="email" type="email" id="email" placeholder="Correo electrónico" required>
        <i class="bx bxs-envelope"></i>
      </div>

      <div class="input-group">
        <input [(ngModel)]="password" name="password" type="password" id="password" placeholder="Contraseña" required>
        <i class='bx bxs-lock-alt'></i>
      </div>

      <div class="form-options">
        <label class="custom-checkbox">
          <input type="checkbox">
          <span class="checkmark"></span>
          Recordar usuario
        </label>
        <a routerLink="/forgotten-password" class="text-link">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="primary-button">Iniciar Sesión</button>

      <div class="form-divider">
        <span>o</span>
      </div>

      <button type="button" class="secondary-button" (click)="goToSignUp()">
        Crear nueva cuenta
      </button>
    </form>
  </div>
</main>
