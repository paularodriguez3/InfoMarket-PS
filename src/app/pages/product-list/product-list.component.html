<main>
  <section id="main-title-wrapper">
    <h1 id="main-title">{{ titulo }}</h1>
    <button id="filter-button"><i class='bx bx-filter-alt'></i> Ordenar y filtrar</button>
  </section>
  <section id="filter-menu-wrapper" class="hidden-filter-menu">
  </section>

  <div>
    <div id="product-grid">
      <app-product
        *ngFor="let product of products"
        [product]="product"
        [imageUrl]="product.Imagen"
      ></app-product>
    </div>
  </div>
</main>
