<article id="product-details">
  <section id="product-details-info">

    <label for="product-desc">Nombre del producto:</label>
    <input type="text" id="product-name" name="product-name" [(ngModel)]="product_name" placeholder="Introduce el nombre del producto">

    <label for="product-desc">Descripción del producto:</label>
    <input type="text" id="product-desc" name="product-desc" [(ngModel)]="description" placeholder="Introduce la descripción del producto">

    <label for="category-select">Categoría:</label>
    <select id="category-select" name="category">
      <option value="">Selecciona una categoría</option>
      <option value="Informática">Informática</option>
      <option value="Gaming">Gaming</option>
      <option value="Telefonia">Telefonia</option>
      <option value="Televisores">Televisores</option>
      <option value="Electrónica">Electrónica</option>

    </select>

    <label for="subcategory-select">Subcategoría:</label>
    <select id="subcategory-select" name="subcategory">
      <option value="">Selecciona una subcategoría</option>
      <option value="moviles">Móviles</option>
      <option value="camisetas">Camisetas</option>
      <option value="cocina">Cocina</option>
    </select>

    <hr class="hr-features">

    <div id="product-features">
      <label>Características:</label>
      <div id="feature-list" *ngFor="let feature in features; let i = index">
        <input type="text" name="feature" [(ngModel)]="features[i]" placeholder="Característica">
      </div>
    </div>

    <hr class="hr-features">

    <div id="quantity-container">
      <div class="quantity-selector">
        <p id="product-quantity">Cantidad:</p>
        <button class="qty-button" id="minus"><i class='bx bxs-minus-circle'></i></button>
        <p id="qty-value">1</p>
        <button class="qty-button" id="plus"><i class='bx bxs-plus-circle'></i></button>
      </div>
    </div>

    <label for="price">Precio por unidad (€):</label>
    <input type="number" id="price" name="price" [(ngModel)]="price" placeholder="0.00" step="0.01" min="0">

    <hr class="hr-features">

    <div id="add-to-cart">
      <button type="submit" id="add-to-cart-button">Añadir producto</button>
    </div>
  </section>

  <div id="product-image">
    <img id="image" alt="Producto" src="/assets/images/Tiendas-en-las-que-operamos.png">
    <div id="button-arrows">
      <button id="prev-image"><i class='bx bx-chevron-left'></i></button>
      <button id="next-image"><i class='bx bx-chevron-right'></i></button>
    </div>
  </div>
</article>
