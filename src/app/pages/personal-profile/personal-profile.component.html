<main>
  <div class="profile-container">
    <div class="profile-card">
      <div class="profile-header">
        <div class="avatar">
          <i class="bx bxs-user"></i>
        </div>
        <h1>Mi Perfil</h1>
        <p>Administra tu información personal</p>
      </div>

      <form class="profile-form" (ngSubmit)="onSave()">
        <div class="form-group">
          <label>Nombre de usuario</label>
          <input type="text" [(ngModel)]="username" name="username" placeholder="Ej: User">
        </div>
        <div class="form-group">
          <label>Nombre</label>
          <input type="text" [(ngModel)]="firstName" name="firstName" placeholder="Ej: Paula Rosa">
        </div>

        <div class="form-group">
          <label>Apellidos</label>
          <input type="text" [(ngModel)]="lastName" name="lastName" placeholder="Ej: Rodríguez Morales">
        </div>

        <div class="form-group">
          <label>Correo electrónico</label>
          <input type="email" [(ngModel)]="email" name="email" placeholder="Ej: ejemplo@gmail.com">
        </div>

        <div class="form-group">
          <label>Teléfono</label>
          <input type="tel" [(ngModel)]="phone" name="phone" placeholder="Ej: 600 000 000">
        </div>

        <div class="form-group">
          <label>Dirección </label>
          <input type="tel" [(ngModel)]="direction1" name="direction" placeholder="C. Practicante Ignacio Rodríguez, 7, Las Palmas de Gran Canaria, Las Palmas ">
        </div>
        <button type="submit" class="save-button">Guardar cambios</button>
        <button type = "button" class="toggle-cards" (click)="toggleCardManager()">Gestionar tarjetas</button>
        <app-card-manager *ngIf="showCardManager" [uid]="uid"></app-card-manager>
        <button type="button" class="logout-button" (click)="logout()">Cerrar sesión</button>
      </form>
    </div>
  </div>
</main>
