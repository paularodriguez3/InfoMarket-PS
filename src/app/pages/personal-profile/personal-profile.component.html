<main>
  <div class="profile-container">
    <div class="profile-card">
      <div class="profile-header">
        <div class="avatar">
          <i class='bx bxs-user'></i>
        </div>
        <h1>Mi Perfil</h1>
        <p>Administra tu información personal</p>
      </div>

      <form class="profile-form">
        <div class="form-group">
          <label>Nombre de usuario</label>
          <input type="text" name="user-name" placeholder="Ej: User">
        </div>
        <div class="form-group">
          <label>Nombre</label>
          <input type="text" name="firstName" placeholder="Ej: Paula Rosa">
        </div>

        <div class="form-group">
          <label>Apellidos</label>
          <input type="text" name="lastName" placeholder="Ej: Rodríguez Morales">
        </div>

        <div class="form-group">
          <label>Correo electrónico</label>
          <input type="email" name="email" placeholder="Ej: ejemplo@gmail.com">
        </div>

        <div class="form-group">
          <label>Teléfono</label>
          <input type="tel" name="phone" placeholder="Ej: 600 000 000">
        </div>

        <button type="submit" class="save-button">Guardar cambios</button>
        <button type="button" class="logout-button">Cerrar sesión</button>
      </form>
    </div>
  </div>
</main>
