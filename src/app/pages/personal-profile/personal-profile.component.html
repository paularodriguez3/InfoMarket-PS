<main>
  <div class="profile-container">
    <div class="profile-card">
      <div class="profile-header">
        <div class="avatar">
          <i class='bx bxs-user'></i>
        </div>
        <h1>Mi Perfil</h1>
        <p>Administra tu información personal</p>
      </div>

      <form class="profile-form" (ngSubmit)="uploadChanges()">
        <div class="form-group">
          <label>Nombre de usuario</label>
          <input type="text" name="user-name" placeholder="Ej: User" [(ngModel)]="user.username">
        </div>
        <div class="form-group">
          <label>Nombre</label>
          <input type="text" name="firstName" placeholder="Ej: Paula Rosa" [(ngModel)]="user.name">
        </div>

        <div class="form-group">
          <label>Apellidos</label>
          <input type="text" name="lastName" placeholder="Ej: Rodríguez Morales" [(ngModel)]="user.surname">
        </div>

        <div class="form-group">
          <label>Correo electrónico</label>
          <input type="email" name="email" placeholder="Ej: ejemplo@gmail.com" [(ngModel)]="user.email">
        </div>

        <div class="form-group">
          <label>Teléfono</label>
          <input type="tel" name="phone" placeholder="Ej: 600 000 000" [(ngModel)]="user.tlf">
        </div>

        <button type="submit" class="save-button">Guardar cambios</button>
        <button type="button" class="logout-button" (click)="signOut()">Cerrar sesión</button>
      </form>
    </div>
  </div>
</main>
