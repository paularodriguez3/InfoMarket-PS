<div class="card-manager">
  <h3>{{ 'ACCOUNT_DELETE.TITLE' | translate }}</h3>

  <p class="no-cards">
    {{ 'ACCOUNT_DELETE.WARNING' | translate }}
  </p>

  <button class="button-cancel-add" type="button" (click)="toggleForm()">
    {{ showConfirmPopup ? ('ACCOUNT_DELETE.CANCEL' | translate) : ('ACCOUNT_DELETE.DELETE' | translate) }}
  </button>

  <div class="add-form" *ngIf="showConfirmPopup">
    <div class="input-icon-cards">
      <i class="bx bxs-envelope"></i>
      <input type="email" [placeholder]="'ACCOUNT_DELETE.EMAIL' | translate" [(ngModel)]="email" />
    </div>

    <div class="input-icon-cards">
      <i class="bx bxs-lock"></i>
      <input type="password" [placeholder]="'ACCOUNT_DELETE.PASSWORD' | translate" [(ngModel)]="password" />
    </div>

    <div class="popup-buttons">
      <button type="button" (click)="confirmAndDelete()">{{ 'ACCOUNT_DELETE.CONFIRM' | translate }}</button>
      <button type="button" class="button-confirm" (click)="toggleForm()">{{ 'ACCOUNT_DELETE.CANCEL' | translate }}</button>
    </div>
  </div>
</div>
