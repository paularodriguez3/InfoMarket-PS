<div class="card-manager">
  <h3>{{ 'CARD_DISPLAY.TITLE' | translate }}</h3>

  <div *ngIf="cards.length === 0" class="no-cards">
    {{ 'CARD_DISPLAY.NO_CARDS' | translate }}
  </div>

  <ul>
    <li *ngFor="let card of cards" class="card-item">
      <div class="card-info">
        <strong>{{ card.brand }}</strong> — {{ '**** **** **** ' + card.cardNumber.slice(-4) }}
        <br />
        <small>{{ 'CARD_DISPLAY.EXPIRES' | translate }}: {{ card.expiry }}</small>
      </div>
      <div class="card-actions">
        <button class="button-cancel-add" type="button" (click)="copyToClipboard(card, 'pan')">
          {{ card.copied === 'pan' ? ('CARD_DISPLAY.COPIED_PAN' | translate) : ('CARD_DISPLAY.COPY_PAN' | translate) }}
        </button>

        <button class="button-cancel-add" type="button" (click)="copyToClipboard(card, 'expiry')">
          {{ card.copied === 'expiry' ? ('CARD_DISPLAY.COPIED_EXPIRY' | translate) : ('CARD_DISPLAY.COPY_EXPIRY' | translate) }}
        </button>

        <button class="button-cancel-add" type="button" (click)="copyToClipboard(card, 'cardholderName')">
          {{ card.copied === 'owner' ? ('CARD_DISPLAY.COPIED_OWNER' | translate) : ('CARD_DISPLAY.COPY_OWNER' | translate) }}
        </button>
      </div>
    </li>
  </ul>
</div>
